<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Endereço e Cálculo de Frete</title>
    <style>
        :root {
            --bg-page: #FBEFEF;
            --bg-container: #FFE2E2;
            --border-color: #F5CBCB;
            --primary-color: #C5B3D3;
            --primary-hover: #F5CBCB;
            --text-color: #4a3f55;
            --input-bg: #ffffff;
            --error-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--bg-container);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(197, 179, 211, 0.4);
            width: 100%;
            max-width: 550px;
        }

        h2, h3 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 20px;
        }

        h3 {
            font-size: 15px;
            margin-top: 25px;
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
            text-align: left;
        }

        .origem-badge {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-color);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(197, 179, 211, 0.5);
        }

        input:disabled, input[readonly] {
            background-color: #fcf4f4;
            cursor: not-allowed;
            color: #888;
        }

        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
            font-weight: bold;
        }

        /* Estilos do Frete */
        .frete-options-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .frete-card {
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .frete-card:hover {
            border-color: var(--primary-color);
        }

        .frete-card input[type="radio"] {
            width: auto;
            margin-right: 10px;
            accent-color: var(--primary-color);
        }

        .frete-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .frete-nome {
            font-weight: bold;
            font-size: 14px;
            color: var(--text-color);
        }

        .frete-prazo {
            font-size: 12px;
            color: #777;
        }

        .frete-preco {
            font-weight: bold;
            color: var(--text-color);
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(197, 179, 211, 0.5);
        }

        button:hover {
            background-color: var(--primary-hover);
            color: var(--text-color);
            box-shadow: 0 4px 10px rgba(245, 203, 203, 0.6);
        }

        .btn-calc {
            background-color: #ffffff;
            color: var(--text-color);
            border: 2px solid var(--primary-color);
            margin-top: 5px;
            padding: 8px;
            font-size: 13px;
        }

        .btn-calc:hover {
            background-color: var(--primary-color);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Endereço e Frete</h2>
        
        <div class="origem-badge">
            <span><strong>Origem Fixa:</strong> São Paulo - SP</span>
            <span>CEP: 01001-000</span>
        </div>

        <form id="enderecoForm">
            
            <!-- Dados do Endereço -->
            <div class="form-group">
                <label for="cep">CEP de Destino</label>
                <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" required>
                <div class="error-message" id="cepError">CEP inválido ou não encontrado.</div>
            </div>

            <div class="form-group">
                <label for="rua">Logradouro (Rua)</label>
                <input type="text" id="rua" name="rua" placeholder="Ex: Rua das Flores" required readonly>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" placeholder="123" required>
                </div>
                <div class="form-group">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Apto 42">
                </div>
            </div>

            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" required readonly>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required readonly>
                </div>
                <div class="form-group">
                    <label for="uf">UF</label>
                    <input type="text" id="uf" name="uf" required readonly>
                </div>
            </div>

            <!-- Dimensões da Encomenda -->
            <h3>Dimensões da Encomenda</h3>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" step="0.1" min="0.1" value="0.5" required>
                </div>
                <div class="form-group">
                    <label for="altura">Altura (cm)</label>
                    <input type="number" id="altura" min="1" value="10" required>
                </div>
                <div class="form-group">
                    <label for="largura">Largura (cm)</label>
                    <input type="number" id="largura" min="1" value="15" required>
                </div>
                <div class="form-group">
                    <label for="comprimento">Comprimento (cm)</label>
                    <input type="number" id="comprimento" min="1" value="20" required>
                </div>
            </div>

            <button type="button" class="btn-calc" id="btnCalcularFrete">Recalcular Opções de Frete</button>

            <!-- Seção de Opções de Frete -->
            <div id="freteSecao" style="display: none;">
                <h3>Opções de Envio Disponíveis</h3>
                <div class="frete-options-container" id="freteOptions"></div>
            </div>

            <button type="submit">Finalizar Pedido</button>
        </form>
    </div>

    <script>
        const CEP_ORIGEM = "01001000";

        // Elementos DOM
        const cepInput = document.getElementById('cep');
        const ruaInput = document.getElementById('rua');
        const bairroInput = document.getElementById('bairro');
        const cidadeInput = document.getElementById('cidade');
        const ufInput = document.getElementById('uf');
        const numeroInput = document.getElementById('numero');
        const cepError = document.getElementById('cepError');

        const pesoInput = document.getElementById('peso');
        const alturaInput = document.getElementById('altura');
        const larguraInput = document.getElementById('largura');
        const comprimentoInput = document.getElementById('comprimento');

        const btnCalcularFrete = document.getElementById('btnCalcularFrete');
        const freteSecao = document.getElementById('freteSecao');
        const freteOptions = document.getElementById('freteOptions');

        // Máscara de CEP automatizada
        cepInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, ''); 
            if (value.length > 5) {
                value = value.replace(/^(\d{5})(\d)/, '$1-$2'); 
            }
            e.target.value = value;
        });

        // Buscar Endereço via API Pública (ViaCEP)
        cepInput.addEventListener('blur', async function() {
            const cep = this.value.replace(/\D/g, '');

            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();

                    if (data.erro) {
                        mostrarErro(true);
                        limparCampos();
                    } else {
                        mostrarErro(false);
                        ruaInput.value = data.logradouro;
                        bairroInput.value = data.bairro;
                        cidadeInput.value = data.localidade;
                        ufInput.value = data.uf;
                        
                        numeroInput.focus();
                        verificarCamposVazios();
                        
                        // Calcula o frete logo após preencher o endereço
                        calcularFrete(data.uf);
                    }
                } catch (error) {
                    mostrarErro(true);
                    limparCampos();
                }
            } else if (cep.length > 0) {
                mostrarErro(true);
                limparCampos();
            }
        });

        btnCalcularFrete.addEventListener('click', () => {
            const cep = cepInput.value.replace(/\D/g, '');
            if (cep.length === 8) {
                calcularFrete(ufInput.value);
            } else {
                alert('Por favor, digite um CEP válido primeiro.');
            }
        });

        // Função de cálculo de frete
        function calcularFrete(ufDestino) {
            const peso = parseFloat(pesoInput.value) || 0.5;
            const altura = parseFloat(alturaInput.value) || 10;
            const largura = parseFloat(larguraInput.value) || 15;
            const comprimento = parseFloat(comprimentoInput.value) || 20;

            // Peso cúbico/volumétrico simples
            const pesoVolumetrico = (altura * largura * comprimento) / 6000;
            const pesoConsiderado = Math.max(peso, pesoVolumetrico);

            // Fator de distância regional baseado no estado
            const eSudeste = ['SP', 'RJ', 'MG', 'ES'].includes(ufDestino);
            const eSul = ['PR', 'SC', 'RS'].includes(ufDestino);
            
            let multiplicadorRegiao = 2.2; // Norte/Nordeste/Centro-Oeste
            if (ufDestino === 'SP') multiplicadorRegiao = 1.0;
            else if (eSudeste) multiplicadorRegiao = 1.3;
            else if (eSul) multiplicadorRegiao = 1.6;

            // Opções geradas dinamicamente
            const opcoesEnvio = [
                {
                    id: 'sedex',
                    empresa: 'Correios',
                    nome: 'SEDEX Express',
                    preco: (16.90 * multiplicadorRegiao + pesoConsiderado * 3.5).toFixed(2),
                    prazo: ufDestino === 'SP' ? '1 a 2 dias úteis' : '2 a 4 dias úteis'
                },
                {
                    id: 'pac',
                    empresa: 'Correios',
                    nome: 'PAC Econômico',
                    preco: (11.50 * multiplicadorRegiao + pesoConsiderado * 2.2).toFixed(2),
                    prazo: ufDestino === 'SP' ? '3 a 5 dias úteis' : '6 a 10 dias úteis'
                },
                {
                    id: 'jadlog',
                    empresa: 'Jadlog',
                    nome: 'Jadlog Package',
                    preco: (10.20 * multiplicadorRegiao + pesoConsiderado * 2.0).toFixed(2),
                    prazo: ufDestino === 'SP' ? '2 a 3 dias úteis' : '4 a 8 dias úteis'
                },
                {
                    id: 'buslog',
                    empresa: 'Buslog',
                    nome: 'Buslog Rodoviário',
                    preco: (13.00 * multiplicadorRegiao + pesoConsiderado * 1.8).toFixed(2),
                    prazo: ufDestino === 'SP' ? '2 dias úteis' : '5 a 7 dias úteis'
                }
            ];

            renderizarOpcoesFrete(opcoesEnvio);
        }

        function renderizarOpcoesFrete(opcoes) {
            freteOptions.innerHTML = '';

            opcoes.forEach((opcao, index) => {
                const card = document.createElement('label');
                card.className = 'frete-card';
                card.innerHTML = `
                    <div class="frete-info">
                        <input type="radio" name="opcao_frete" value="${opcao.empresa} - ${opcao.nome}" ${index === 0 ? 'checked' : ''} required>
                        <div>
                            <div class="frete-nome">${opcao.empresa} - ${opcao.nome}</div>
                            <div class="frete-prazo">Prazo: ${opcao.prazo}</div>
                        </div>
                    </div>
                    <div class="frete-preco">R$ ${opcao.preco.replace('.', ',')}</div>
                `;
                freteOptions.appendChild(card);
            });

            freteSecao.style.display = 'block';
        }

        function mostrarErro(show) {
            cepError.style.display = show ? 'block' : 'none';
            cepInput.style.borderColor = show ? 'var(--error-color)' : 'var(--border-color)';
        }

        function limparCampos() {
            ruaInput.value = '';
            bairroInput.value = '';
            cidadeInput.value = '';
            ufInput.value = '';
            freteSecao.style.display = 'none';
        }

        function verificarCamposVazios() {
            if (ruaInput.value === '') ruaInput.readOnly = false;
            if (bairroInput.value === '') bairroInput.readOnly = false;
        }

        document.getElementById('enderecoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const freteSelecionado = document.querySelector('input[name="opcao_frete"]:checked');
            if(!freteSelecionado) {
                alert('Por favor, selecione uma opção de frete!');
                return;
            }
            alert(`Pedido Confirmado!\n\nFrete Escolhido: ${freteSelecionado.value}`);
        });
    </script>
</body>
</html>
